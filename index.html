<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: sans-serif; background: #1c2330; color: #fff; padding: 20px; text-align: center; }
button { width: 100%; padding: 14px; margin: 8px 0; border: 0; border-radius: 10px; background: #2b7fd6; color: #fff; font-size: 16px; }
button:disabled { opacity: .6; }
#out { white-space: pre-line; font-size: 17px; line-height: 1.7; margin: 14px 0; min-height: 90px; }
small { color: #8a93a6; }
</style>
</head>
<body>
<h2>Internet Meter</h2>
<small>версия 2</small>
<button id="run" onclick="measure()">🚀 Измерить скорость</button>
<div id="out"></div>
<button onclick="send('history')">📜 История</button>
<button onclick="send('ip')">🌍 IP сервера</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
function send(cmd) { tg.sendData(cmd); }

const API = 'https://speed.cloudflare.com/';
const $ = id => document.getElementById(id);
const mbps = (bytes, t0) => bytes * 8 / ((performance.now() - t0) / 1000) / 1e6;

async function ping() {
  const a = [];
  for (let i = 0; i < 9; i++) {
    const t = performance.now();
    await fetch(API + '__down?bytes=0&r=' + Math.random(), { cache: 'no-store' });
    a.push(performance.now() - t);
  }
  a.shift();
  let j = 0;
  for (let i = 1; i < a.length; i++) j += Math.abs(a[i] - a[i - 1]);
  return { ping: Math.min(...a), jit: j / (a.length - 1) };
}

async function download(ms, cb) {
  const ctl = new AbortController(), t0 = performance.now();
  let bytes = 0;
  const worker = async () => {
    while (performance.now() - t0 < ms) {
      try {
        const r = await fetch(API + '__down?bytes=25000000&r=' + Math.random(), { signal: ctl.signal, cache: 'no-store' });
        const rd = r.body.getReader();
        for (;;) {
          const { done, value } = await rd.read();
          if (done) break;
          bytes += value.length;
          cb(mbps(bytes, t0));
          if (performance.now() - t0 >= ms) { ctl.abort(); return; }
        }
      } catch (e) { return; }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  return mbps(bytes, t0);
}

function upload(ms, cb) {
  return new Promise(res => {
    const t0 = performance.now(), data = new Blob([new Uint8Array(3e6)]), xs = [];
    let sent = 0, done = false;
    const finish = () => { if (done) return; done = true; xs.forEach(x => x.abort()); res(mbps(sent, t0)); };
    const run = () => {
      if (done) return;
      const x = new XMLHttpRequest(); let l = 0; xs.push(x);
      x.open('POST', API + '__up');
      x.upload.onprogress = e => {
        sent += e.loaded - l; l = e.loaded; cb(mbps(sent, t0));
        if (performance.now() - t0 >= ms) finish();
      };
      x.onloadend = run;
      x.onerror = finish;
      x.send(data);
    };
    for (let i = 0; i < 4; i++) run();
    setTimeout(finish, ms + 500);
  });
}

async function measure() {
  const b = $('run'), o = $('out');
  b.disabled = true;
  try {
    o.textContent = '⏳ Измеряю пинг…';
    const p = await ping();
    const l1 = '📡 Пинг: ' + p.ping.toFixed(0) + ' мс · Джиттер: ' + p.jit.toFixed(1) + ' мс\n';
    o.textContent = l1;
    const d = await download(8000, s => o.textContent = l1 + '⬇️ Загрузка: ' + s.toFixed(1) + ' Мбит/с…');
    const l2 = l1 + '⬇️ Загрузка: ' + d.toFixed(1) + ' Мбит/с\n';
    o.textContent = l2;
    const u = await upload(8000, s => o.textContent = l2 + '⬆️ Отдача: ' + s.toFixed(1) + ' Мбит/с…');
    o.textContent = l2 + '⬆️ Отдача: ' + u.toFixed(1) + ' Мбит/с';
  } catch (e) {
    o.textContent = '❌ Не удалось измерить. Проверьте соединение.';
  }
  b.disabled = false;
}
</script>
</body>
</html>
