<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-color: #0b1120;
    --card-bg: rgba(255, 255, 255, 0.05);
    --accent: #00d2ff;
    --accent-gradient: linear-gradient(135deg, #00d2ff, #3a7bd5);
    --text-main: #ffffff;
    --text-muted: #8892b0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 0%, #1a2a44 0%, var(--bg-color) 70%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Переключатель языка */
  .lang-switcher {
    position: absolute;
    top: 15px;
    right: 15px;
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    backdrop-filter: blur(10px);
    appearance: none;
    -webkit-appearance: none;
  }
  .lang-switcher option { background: #141e30; color: #fff; }

  .header { text-align: center; margin-top: 20px; margin-bottom: 30px; }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .header p { font-size: 14px; color: var(--text-muted); margin-top: 5px; }

  /* Спидометр */
  .gauge-container {
    position: relative;
    width: 240px;
    height: 240px;
    margin-bottom: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-track { fill: none; stroke: rgba(255, 255, 255, 0.05); stroke-width: 12; }
  .gauge-fill {
    fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 691;
    stroke-dashoffset: 691;
    transition: stroke-dashoffset 0.3s ease-out, stroke 0.3s;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  .gauge-content { position: absolute; text-align: center; display: flex; flex-direction: column; }
  .speed-value {
    font-size: 56px; font-weight: 800; line-height: 1;
    background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .speed-unit { font-size: 14px; color: var(--text-muted); font-weight: 600; margin-top: 5px; letter-spacing: 2px; }
  .status-text { font-size: 14px; color: var(--accent); margin-top: 10px; font-weight: 500; height: 20px;}

  /* Кнопки */
  .action-btn {
    width: 100%; max-width: 300px; padding: 18px; border: none; border-radius: 16px;
    background: var(--accent-gradient); color: white; font-size: 16px; font-weight: 600;
    cursor: pointer; box-shadow: 0 8px 24px rgba(0, 210, 255, 0.3);
    transition: transform 0.1s, box-shadow 0.2s;
    margin-bottom: 20px;
  }
  .action-btn:active { transform: scale(0.96); }
  .action-btn:disabled { background: #2a364a; color: #5a6b85; box-shadow: none; cursor: not-allowed; }

  .secondary-grid { display: flex; gap: 15px; width: 100%; max-width: 300px; }
  .sec-btn {
    flex: 1; padding: 15px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
    background: var(--card-bg); color: var(--text-main); font-size: 14px; font-weight: 500;
    backdrop-filter: blur(10px); cursor: pointer; transition: background 0.2s;
  }
  .sec-btn:active { background: rgba(255, 255, 255, 0.1); }

  /* Всплывающая панель */
  .bottom-sheet {
    position: fixed; bottom: -100%; left: 0; width: 100%;
    background: #141e30; border-radius: 24px 24px 0 0;
    padding: 25px 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100; border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .bottom-sheet.open { bottom: 0; }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .sheet-title { font-size: 20px; font-weight: 600; }
  .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  
  .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; }
  .history-item {
    background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    border-left: 3px solid var(--accent);
  }
  .ip-display { text-align: center; font-size: 32px; font-weight: bold; color: var(--accent); margin: 20px 0; letter-spacing: 1px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 90; }
  .overlay.open { opacity: 1; pointer-events: auto; }

</style>
</head>
<body>

  <!-- Селектор языка -->
  <select class="lang-switcher" id="lang-select" onchange="changeLanguage(this.value)">
    <option value="ru">🇷🇺 RU</option>
    <option value="en">🇺🇸 EN</option>
    <option value="pl">🇵🇱 PL</option>
    <option value="de">🇩🇪 DE</option>
  </select>

  <div class="header">
    <h1 id="app-title">INTERNET METER</h1>
    <p id="app-subtitle">Проверьте скорость вашего соединения</p>
  </div>

  <div class="gauge-container">
    <svg class="gauge-svg" viewBox="0 0 240 240">
      <circle class="gauge-track" cx="120" cy="120" r="110"></circle>
      <circle class="gauge-fill" id="gauge-fill" cx="120" cy="120" r="110"></circle>
    </svg>
    <div class="gauge-content">
      <div class="speed-value" id="speed-val">0</div>
      <div class="speed-unit" id="speed-unit">MBPS</div>
      <div class="status-text" id="status-text">Готов к работе</div>
    </div>
  </div>

  <button id="start-btn" class="action-btn" onclick="runSpeedTest()">🚀 Начать тест</button>

  <div class="secondary-grid">
    <button class="sec-btn" id="btn-ip" onclick="showIP()">🌍 Мой IP</button>
    <button class="sec-btn" id="btn-hist" onclick="showHistory()">📜 История</button>
  </div>

  <div class="overlay" id="overlay" onclick="closeSheet()"></div>

  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-title">Информация</div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheet-content"></div>
  </div>

<script>
  // --- СЛОВАРИ ПЕРЕВОДОВ ---
  const translations = {
    ru: {
      subtitle: "Проверьте скорость вашего соединения",
      statusReady: "Готов к работе",
      statusPing: "Проверка пинга...",
      statusDownload: "Загрузка данных...",
      statusPingResult: "Пинг: {ping} ms",
      btnStart: "🚀 Начать тест",
      btnRepeat: "🚀 Повторить тест",
      btnTesting: "Тестирование...",
      btnIp: "🌍 Мой IP",
      btnHistory: "📜 История",
      titleHistory: "Последние замеры",
      titleIp: "Ваш IP-адрес",
      historyEmpty: "История пуста",
      errorNetwork: "Ошибка сети",
      errorIp: "Не удалось получить IP"
    },
    en: {
      subtitle: "Check your connection speed",
      statusReady: "Ready",
      statusPing: "Checking ping...",
      statusDownload: "Downloading data...",
      statusPingResult: "Ping: {ping} ms",
      btnStart: "🚀 Start Test",
      btnRepeat: "🚀 Test Again",
      btnTesting: "Testing...",
      btnIp: "🌍 My IP",
      btnHistory: "📜 History",
      titleHistory: "Recent tests",
      titleIp: "Your IP Address",
      historyEmpty: "History is empty",
      errorNetwork: "Network error",
      errorIp: "Failed to get IP"
    },
    pl: {
      subtitle: "Sprawdź prędkość połączenia",
      statusReady: "Gotowy",
      statusPing: "Sprawdzanie pingu...",
      statusDownload: "Pobieranie danych...",
      statusPingResult: "Ping: {ping} ms",
      btnStart: "🚀 Rozpocznij test",
      btnRepeat: "🚀 Powtórz test",
      btnTesting: "Testowanie...",
      btnIp: "🌍 Moje IP",
      btnHistory: "📜 Historia",
      titleHistory: "Ostatnie testy",
      titleIp: "Twój adres IP",
      historyEmpty: "Historia jest pusta",
      errorNetwork: "Błąd sieci",
      errorIp: "Nie udało się pobrać IP"
    },
    de: {
      subtitle: "Prüfen Sie Ihre Verbindungsgeschwindigkeit",
      statusReady: "Bereit",
      statusPing: "Ping prüfen...",
      statusDownload: "Daten herunterladen...",
      statusPingResult: "Ping: {ping} ms",
      btnStart: "🚀 Test starten",
      btnRepeat: "🚀 Erneut testen",
      btnTesting: "Testen...",
      btnIp: "🌍 Meine IP",
      btnHistory: "📜 Verlauf",
      titleHistory: "Letzte Tests",
      titleIp: "Ihre IP-Adresse",
      historyEmpty: "Verlauf ist leer",
      errorNetwork: "Netzwerkfehler",
      errorIp: "IP konnte nicht abgerufen werden"
    }
  };

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let currentLang = 'ru';
  const CIRCUMFERENCE = 691;

  // --- ИНИЦИАЛИЗАЦИЯ ЯЗЫКА ---
  function initLanguage() {
    // 1. Проверяем сохраненный язык
    let savedLang = localStorage.getItem('appLang');
    
    // 2. Если нет, берем из Telegram
    if (!savedLang && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const tgLang = tg.initDataUnsafe.user.language_code;
      if (translations[tgLang]) {
        savedLang = tgLang;
      }
    }

    // 3. По умолчанию английский, если язык не поддерживается
    currentLang = savedLang || 'en';
    
    document.getElementById('lang-select').value = currentLang;
    applyTranslations();
  }

  function changeLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    applyTranslations();
    
    // Перерисовываем открытые панели, если они есть
    const sheet = document.getElementById('bottom-sheet');
    if (sheet.classList.contains('open')) {
       // Если открыта история или IP, просто закрываем, чтобы не путать
       closeSheet();
    }
  }

  function t(key, variables = {}) {
    let text = translations[currentLang][key] || translations['en'][key];
    for (let k in variables) {
      text = text.replace(`{${k}}`, variables[k]);
    }
    return text;
  }

  function applyTranslations() {
    document.getElementById('app-subtitle').innerText = t('subtitle');
    document.getElementById('btn-ip').innerText = t('btnIp');
    document.getElementById('btn-hist').innerText = t('btnHistory');
    
    const startBtn = document.getElementById('start-btn');
    if (!startBtn.disabled) {
      // Если кнопка не в процессе теста, меняем текст
      startBtn.innerText = startBtn.dataset.tested === 'true' ? t('btnRepeat') : t('btnStart');
    }

    const statusText = document.getElementById('status-text');
    if (statusText.innerText === "Готов к работе" || statusText.innerText === "Ready" || statusText.innerText === "Gotowy" || statusText.innerText === "Bereit") {
      statusText.innerText = t('statusReady');
    }
  }

  // Haptic Feedback
  function vibrate(type = 'light') {
    if (tg.HapticFeedback) {
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    }
  }

  // --- ТЕСТ СКОРОСТИ ---
  async function runSpeedTest() {
    vibrate('medium');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status-text');
    const speedVal = document.getElementById('speed-val');
    const gaugeFill = document.getElementById('gauge-fill');

    startBtn.disabled = true;
    startBtn.innerText = t('btnTesting');
    statusText.innerText = t('statusPing');
    speedVal.innerText = "0";
    gaugeFill.style.strokeDashoffset = CIRCUMFERENCE;

    try {
      const pingStart = performance.now();
      await fetch('https://speed.cloudflare.com/__down?bytes=0', { cache: 'no-store' });
      const ping = Math.round(performance.now() - pingStart);

      statusText.innerText = t('statusDownload');
      
      let currentFakeSpeed = 0;
      const animationInterval = setInterval(() => {
        currentFakeSpeed += Math.random() * 5;
        if (currentFakeSpeed > 80) currentFakeSpeed = 20;
        updateGauge(currentFakeSpeed);
        speedVal.innerText = Math.round(currentFakeSpeed);
      }, 100);

      const startTime = performance.now();
      const response = await fetch('https://speed.cloudflare.com/__down?bytes=15000000', { cache: 'no-store' });
      const blob = await response.blob();
      const durationSec = (performance.now() - startTime) / 1000;
      
      clearInterval(animationInterval);

      const sizeInBits = blob.size * 8;
      const speedMbps = parseFloat((sizeInBits / durationSec / 1000 / 1000).toFixed(1));

      statusText.innerText = t('statusPingResult', { ping: ping });
      speedVal.innerText = speedMbps;
      updateGauge(speedMbps);
      
      vibrate('success');
      saveToHistory(speedMbps, ping);

    } catch (error) {
      statusText.innerText = t('errorNetwork');
      speedVal.innerText = "0";
      gaugeFill.style.strokeDashoffset = CIRCUMFERENCE;
      vibrate('light');
    } finally {
      startBtn.disabled = false;
      startBtn.dataset.tested = 'true';
      startBtn.innerText = t('btnRepeat');
    }
  }

  function updateGauge(speed) {
    const MAX_SPEED = 100;
    const cappedSpeed = Math.min(speed, MAX_SPEED);
    const offset = CIRCUMFERENCE - (cappedSpeed / MAX_SPEED) * CIRCUMFERENCE;
    const gaugeFill = document.getElementById('gauge-fill');
    gaugeFill.style.strokeDashoffset = offset;
    
    if (speed < 10) gaugeFill.style.stroke = "#ff4b4b";
    else if (speed < 30) gaugeFill.style.stroke = "#f39c12";
    else gaugeFill.style.stroke = "#00d2ff";
  }

  // --- ИСТОРИЯ ---
  function saveToHistory(speed, ping) {
    let history = JSON.parse(localStorage.getItem('speedHistory')) || [];
    // Используем локаль для правильного формата времени
    const time = new Date().toLocaleTimeString(currentLang, {hour: '2-digit', minute:'2-digit'});
    history.unshift({ time, speed, ping });
    if (history.length > 5) history.pop();
    localStorage.setItem('speedHistory', JSON.stringify(history));
  }

  function showHistory() {
    vibrate('light');
    const sheet = document.getElementById('bottom-sheet');
    const title = document.getElementById('sheet-title');
    const content = document.getElementById('sheet-content');
    const overlay = document.getElementById('overlay');

    title.innerText = t('titleHistory');
    let history = JSON.parse(localStorage.getItem('speedHistory')) || [];
    
    if (history.length === 0) {
      content.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 20px;">${t('historyEmpty')}</div>`;
    } else {
      content.innerHTML = `<div class="history-list">
        ${history.map(item => `
          <div class="history-item">
            <span style="color:var(--text-muted)">${item.time}</span>
            <span style="font-weight:bold; color:var(--accent)">${item.speed} Mbps</span>
            <span style="color:var(--text-muted); font-size:12px;">${item.ping} ms</span>
          </div>
        `).join('')}
      </div>`;
    }

    sheet.classList.add('open');
    overlay.classList.add('open');
  }

  // --- IP АДРЕС ---
  async function showIP() {
    vibrate('light');
    const sheet = document.getElementById('bottom-sheet');
    const title = document.getElementById('sheet-title');
    const content = document.getElementById('sheet-content');
    const overlay = document.getElementById('overlay');

    title.innerText = t('titleIp');
    content.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 20px;">...</div>`;
    
    sheet.classList.add('open');
    overlay.classList.add('open');

    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      content.innerHTML = `
        <div class="ip-display">${data.ip}</div>
      `;
    } catch (e) {
      content.innerHTML = `<div style="text-align:center; color:#ff4b4b; padding: 20px;">${t('errorIp')}</div>`;
    }
  }

  function closeSheet() {
    document.getElementById('bottom-sheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  // Запускаем при старте
  initLanguage();
</script>
</body>
</html>
